<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      font-size: 30px;
    }

    #reader {
      width: 90vw;
      max-width: 700px;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
    }

    /* カメラ映像 */
    #reader video {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    /*
      QRコードを合わせる四角い枠
      縦向き・横向きの両方に対応
    */
    #scan-frame {
      position: absolute;
      width: min(60vw, 60vh, 300px);
      height: min(60vw, 60vh, 300px);

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border: 5px solid white;
      border-radius: 8px;

      box-sizing: border-box;

      pointer-events: none;

      z-index: 10;

      /* 見やすくするため少し影をつける */
      box-shadow:
        0 0 0 2px rgba(0, 0, 0, 0.35),
        0 0 15px rgba(0, 0, 0, 0.4);
    }

    #result {
      margin-top: 25px;
      font-size: 24px;
      font-weight: bold;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 10px;
    }

    .error {
      color: red;
    }

    /* 横向きのとき */
    @media (orientation: landscape) {
      #reader {
        width: 75vw;
        max-width: 800px;
      }

      h1 {
        font-size: 28px;
        margin: 10px;
      }

      #result {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

<h1>社員受付</h1>

<p>QRコードをカメラの四角い枠に合わせてください</p>

<div id="reader">
  <div id="scan-frame"></div>
</div>

<div id="result"></div>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx0Yhbu42o5JXZ91oB_TDqxb6ljHvoc6tIIo2LiPIKrEyV67dsBmrdr0thm9aainFPM/exec";

let processing = false;


// =========================
// QRコードを読み取ったとき
// =========================

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  document.getElementById("result").textContent =
    "社員を確認しています…";

  const callbackName =
    "employeeCallback_" + Date.now();

  window[callbackName] = function(employee) {

    delete window[callbackName];

    if (!employee.ok) {

      document.getElementById("result").innerHTML =
        '<p class="error">' +
        employee.message +
        '</p>' +

        '<button onclick="nextEmployee()">' +
        'もう一度読み取る' +
        '</button>';

      processing = false;

      return;
    }

    document.getElementById("result").innerHTML =

      "<h2>" +
      employee.name +
      " さん</h2>" +

      "<p>この名前で記録しますか？</p>" +

      '<button onclick="confirmEmployee(\'' +
      employee.id +
      '\')">' +
      "本人です" +
      "</button>" +

      '<button onclick="nextEmployee()">' +
      "違います" +
      "</button>";
  };

  const script =
    document.createElement("script");

  script.src =
    APPS_SCRIPT_URL +
    "?action=lookup" +
    "&token=" +
    encodeURIComponent(decodedText) +
    "&callback=" +
    callbackName;

  document.body.appendChild(script);
}


// =========================
// 本人ですを押したとき
// =========================

function confirmEmployee(id) {

  document.getElementById("result").innerHTML =
    "<p>出勤を記録しています…</p>";

  const callbackName =
    "attendanceCallback_" + Date.now();

  window[callbackName] = function(result) {

    delete window[callbackName];

    if (!result.ok) {

      document.getElementById("result").innerHTML =
        '<p class="error">' +
        result.message +
        '</p>' +

        '<button onclick="nextEmployee()">' +
        'もう一度読み取る' +
        '</button>';

      return;
    }

    document.getElementById("result").innerHTML =

      "<h2>✓ 出勤を記録しました</h2>" +

      "<p>" +
      result.name +
      " さん</p>" +

      '<button onclick="nextEmployee()">' +
      "次の人" +
      "</button>";
  };

  const script =
    document.createElement("script");

  // iPadの今日の日付

  const now = new Date();

  const dateText =
    now.getFullYear() + "-" +
    String(now.getMonth() + 1).padStart(2, "0") + "-" +
    String(now.getDate()).padStart(2, "0");

  script.src =
    APPS_SCRIPT_URL +
    "?action=attendance" +
    "&employeeId=" +
    encodeURIComponent(id) +
    "&date=" +
    encodeURIComponent(dateText) +
    "&callback=" +
    callbackName;

  document.body.appendChild(script);
}


// =========================
// 次の人へ
// =========================

function nextEmployee() {

  processing = false;

  document.getElementById("result").innerHTML =
    "<p>次の方のQRコードを読み取ってください</p>";
}


// =========================
// QRスキャナー開始
// =========================

const scanner =
  new Html5Qrcode("reader");

scanner.start(
  {
    facingMode: "user"
  },
  {
    fps: 10,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      const size =
        Math.floor(
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.6
        );

      return {
        width: size,
        height: size
      };
    }
  },
  onScanSuccess,
  function(errorMessage) {
    // 読み取り中のエラーは表示しない
  }
)
.catch(function(error) {

  document.getElementById("result").innerHTML =
    '<p class="error">' +
    "QRスキャナーを起動できませんでした<br>" +
    error +
    "</p>";

});

</script>

</body>
</html>
