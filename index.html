<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 30px;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 25px;
      font-size: 24px;
      font-weight: bold;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 10px;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

<h1>社員受付</h1>

<p>QRコードをカメラに映してください</p>

<div id="reader"></div>

<div id="result"></div>

<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx0Yhbu42o5JXZ91oB_TDqxb6ljHvoc6tIIo2LiPIKrEyV67dsBmrdr0thm9aainFPM/exec";

let processing = false;


// =========================
// QRコードを読み取ったとき
// =========================

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  document.getElementById("result").textContent =
    "社員を確認しています…";


  const callbackName =
    "employeeCallback_" + Date.now();


  window[callbackName] = function(employee) {

    delete window[callbackName];


    if (!employee.ok) {

      document.getElementById("result").innerHTML =
        '<p class="error">' +
        employee.message +
        '</p>' +

        '<button onclick="nextEmployee()">' +
        'もう一度読み取る' +
        '</button>';

      processing = false;

      return;
    }


    // 社員名を表示

    document.getElementById("result").innerHTML =

      "<h2>" +
      employee.name +
      " さん</h2>" +

      "<p>この名前で記録しますか？</p>" +

      '<button onclick="confirmEmployee(\'' +
      employee.id +
      '\')">' +
      "本人です" +
      "</button>" +

      '<button onclick="nextEmployee()">' +
      "違います" +
      "</button>";
  };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=lookup" +
    "&token=" +
    encodeURIComponent(decodedText) +
    "&callback=" +
    callbackName;


  document.body.appendChild(script);
}


// =========================
// 本人ですを押したとき
// =========================

    delete window[callbackName];

        '<button onclick="nextEmployee()">' +
        'もう一度読み取る' +
        '</button>';

      return;
    }

      " さん</p>" +
