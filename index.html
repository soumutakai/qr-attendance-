<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 30px;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 25px;
      font-size: 24px;
      font-weight: bold;
      min-height: 80px;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 10px;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }
  </style>
</head>

<body>

<h1>社員受付</h1>

<p>QRコードをカメラに映してください</p>

<div id="reader"></div>

<div id="result">
  <p>QRコードを読み取ってください</p>
</div>


<script>

// ========================================
// Apps ScriptのURL
// ========================================

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx0Yhbu42o5JXZ91oB_TDqxb6ljHvoc6tIIo2LiPIKrEyV67dsBmrdr0thm9aainFPM/exec";


// ========================================
// 処理中かどうか
// ========================================

let processing = false;


// ========================================
// QRコードを読み取ったとき
// ========================================

function onScanSuccess(decodedText) {

  // すでに処理中なら無視
  if (processing) {
    return;
  }

  processing = true;

  document.getElementById("result").innerHTML =
    "<p>社員を確認しています…</p>";


  // ======================================
  // Apps Scriptから社員情報を受け取る
  // ======================================

  const callbackName =
    "employeeCallback_" + Date.now();

  window[callbackName] = function(employee) {

    delete window[callbackName];


    // --------------------------------------
    // 社員が見つからなかった場合
    // --------------------------------------

    if (!employee.ok) {

      document.getElementById("result").innerHTML =
        '<p class="error">' +
        employee.message +
        '</p>' +

        '<button onclick="nextEmployee()">' +
        'もう一度読み取る' +
        '</button>';

      processing = false;

      return;
    }


    // --------------------------------------
    // 社員名を表示
    // --------------------------------------

    document.getElementById("result").innerHTML =

      "<h2>" +
      employee.name +
      " さん</h2>" +

      "<p>この名前で記録しますか？</p>" +

      '<button onclick="confirmEmployee(\'' +
      employee.id +
      '\')">' +
      "本人です" +
      "</button>" +

      '<button onclick="nextEmployee()">' +
      "違います" +
      "</button>";
  };


  // ======================================
  // Apps Scriptへ社員照会
  // ======================================

  const script =
    document.createElement("script");

  script.src =
    APPS_SCRIPT_URL +
    "?action=lookup" +
    "&token=" +
    encodeURIComponent(decodedText) +
    "&callback=" +
    callbackName;

  document.body.appendChild(script);
}


// ========================================
// 「本人です」を押したとき
// ========================================

function confirmEmployee(id) {

  document.getElementById("result").innerHTML =
    "<p>出勤を記録しています…</p>";


  // ======================================
  // 今日の日付を取得
  // ======================================

  const now = new Date();

  const dateText =
    now.getFullYear() + "-" +
    String(now.getMonth() + 1).padStart(2, "0") + "-" +
    String(now.getDate()).padStart(2, "0");


  // ======================================
  // Apps Scriptから結果を受け取る
  // ======================================

  const callbackName =
    "attendanceCallback_" + Date.now();

  window[callbackName] = function(result) {

    delete window[callbackName];


    // --------------------------------------
    // エラー
    // --------------------------------------

    if (!result.ok) {

      document.getElementById("result").innerHTML =
        '<p class="error">' +
        result.message +
        '</p>' +

        '<button onclick="nextEmployee()">' +
        'もう一度読み取る' +
        '</button>';

      return;
    }


    // --------------------------------------
    // 出勤成功
    // --------------------------------------

    document.getElementById("result").innerHTML =

      '<h2 class="success">✓ ' +
      result.name +
      ' さん</h2>' +

      "<p>出勤を記録しました</p>";


    // ======================================
    // 0.5秒後に自動的に次の人へ
    // ======================================

    setTimeout(function() {

      nextEmployee();

    }, 500);

  };


  // ======================================
  // Apps Scriptへ出勤記録
  // ======================================

  const script =
    document.createElement("script");

  script.src =
    APPS_SCRIPT_URL +
    "?action=attendance" +
    "&employeeId=" +
    encodeURIComponent(id) +
    "&date=" +
    encodeURIComponent(dateText) +
    "&callback=" +
    callbackName;

  document.body.appendChild(script);
}


// ========================================
// 次の人へ
// ========================================

function nextEmployee() {

  processing = false;

  document.getElementById("result").innerHTML =
    "<p>次の方のQRコードを読み取ってください</p>";
}


// ========================================
// QRスキャナー開始
// ========================================

const scanner =
  new Html5Qrcode("reader");


scanner.start(

  {
    facingMode: "user"
  },

  {
    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }
  },

  onScanSuccess,

  function(errorMessage) {
    // 読み取り中のエラーは表示しない
  }

)

.catch(function(error) {

  document.getElementById("result").innerHTML =

    '<p class="error">' +

    "QRスキャナーを起動できませんでした<br>" +

    error +

    "</p>";

});

</script>

</body>
