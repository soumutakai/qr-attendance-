<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: white;
    }

    #status {
      margin: 20px 0;
      font-size: 20px;
      font-weight: bold;
    }

    #result {
      margin: 20px auto;
      max-width: 500px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      font-size: 22px;
    }

    button {
      font-size: 24px;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      background: #1976d2;
      color: white;
    }

    button:disabled {
      background: #aaa;
    }

    .ready {
      color: green;
    }

    .error {
      color: red;
    }

    .employee-name {
      font-size: 36px;
      font-weight: bold;
      margin: 20px 0;
    }

    .success {
      color: green;
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>社員受付</h1>

  <div id="status">
    受付を準備しています…
  </div>

  <div id="reader"></div>

  <div id="result">
    <p>QRコードを読み取ってください</p>
  </div>


  <script>

    // =========================================================
    // Apps Script WebアプリURL
    // =========================================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyAJlvXfXFLtn0iTYh6obTzeoe-YkTW8YVzVMtAHPEsOzEnkO_6scH3_9W8MOCzE9Yh/exec";


    // =========================================================
    // グローバル変数
    // =========================================================

    let processing = false;

    let currentEmployee = null;

    let audioContext = null;


    // =========================================================
    // 成功音の準備
    // =========================================================

    function prepareSuccessSound() {

      try {

        if (!audioContext) {
          audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

      } catch (error) {

        console.log("音声準備エラー", error);

      }

    }


    // =========================================================
    // 成功音「キーン♪」
    // =========================================================

    function playSuccessSound() {

      try {

        if (!audioContext) return;

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        const now =
          audioContext.currentTime;

        const oscillator =
          audioContext.createOscillator();

        const gainNode =
          audioContext.createGain();

        oscillator.connect(gainNode);

        gainNode.connect(
          audioContext.destination
        );

        oscillator.type = "sine";

        oscillator.frequency.value = 1200;

        gainNode.gain.setValueAtTime(
          0.001,
          now
        );

        gainNode.gain.exponentialRampToValueAtTime(
          0.18,
          now + 0.02
        );

        gainNode.gain.exponentialRampToValueAtTime(
          0.001,
          now + 0.35
        );

        oscillator.start(now);

        oscillator.stop(
          now + 0.35
        );

      } catch (error) {

        console.log(
          "成功音エラー",
          error
        );

      }

    }


    // =========================================================
    // QRコード読み取り成功
    // =========================================================

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }

      processing = true;


      // QRコードの中身
      const token =
        String(decodedText || "")
          .replace(/\s/g, "")
          .trim();


      // -------------------------------------------------------
      // 表示
      // -------------------------------------------------------

      document.getElementById("status").innerHTML =
        '<span>社員を確認しています…</span>';

      document.getElementById("result").innerHTML =
        "<p>社員情報を確認しています。<br>少しお待ちください。</p>";


      // -------------------------------------------------------
      // Apps ScriptへQR用IDを送る
      // -------------------------------------------------------

      const callbackName =
        "lookupCallback_" +
        Date.now();


      window[callbackName] =
        function(result) {

          delete window[callbackName];


          // ---------------------------------------------------
          // 社員検索エラー
          // ---------------------------------------------------

          if (!result.ok) {

            currentEmployee = null;

            document.getElementById("status").innerHTML =
              '<span class="error">' +
              "社員確認に失敗しました" +
              "</span>";

            document.getElementById("result").innerHTML =
              '<p class="error">' +
              (result.message ||
               "登録されていないQRコードです。") +
              "</p>" +

              '<button onclick="nextEmployee()">' +
              "戻る" +
              "</button>";

            return;
          }


          // ---------------------------------------------------
          // 社員確認成功
          // ---------------------------------------------------

          currentEmployee = {
            id: result.id,
            name: result.name
          };


          document.getElementById("status").innerHTML =
            '<span class="ready">' +
            "社員を確認しました" +
            "</span>";


          document.getElementById("result").innerHTML =

            '<div class="employee-name">' +
            result.name +
            " さん</div>" +

            "<p>この社員で間違いありませんか？</p>" +

            '<button onclick="confirmEmployee()">' +
            "本人です" +
            "</button>" +

            '<button onclick="nextEmployee()">' +
            "キャンセル" +
            "</button>";

        };


      // -------------------------------------------------------
      // JSONP
      // -------------------------------------------------------

      const script =
        document.createElement("script");


      script.src =
        APPS_SCRIPT_URL +
        "?action=lookup" +
        "&token=" +
        encodeURIComponent(token) +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


      // -------------------------------------------------------
      // 通信エラー
      // -------------------------------------------------------

      script.onerror =
  function() {

    delete window[callbackName];

    currentEmployee = null;

    console.log(
      "Apps Script通信エラーURL:",
      script.src
    );

    document.getElementById("status").innerHTML =
      '<span class="error">' +
      "社員確認に失敗しました" +
      "</span>";

    document.getElementById("result").innerHTML =
      '<p class="error">' +
      "Apps Scriptとの通信に失敗しました。<br>" +
      "もう一度QRコードを読み取ってください。" +
      "</p>" +

      '<button onclick="nextEmployee()">' +
      "戻る" +
      "</button>";

  };


      document.body.appendChild(script);

    }


    // =========================================================
    // 本人確認 → 出勤記録
    // =========================================================

    function confirmEmployee() {

      if (!currentEmployee) {

        document.getElementById("result").innerHTML =
          '<p class="error">' +
          "社員情報がありません。" +
          "</p>";

        return;
      }


      // iPadの音声再生準備
      prepareSuccessSound();


      document.getElementById("result").innerHTML =
        "<p>出勤を記録しています…</p>";


      document.getElementById("status").innerHTML =
        "<span>記録中…</span>";


      // -------------------------------------------------------
      // JSONPコールバック
      // -------------------------------------------------------

      const callbackName =
        "attendanceCallback_" +
        Date.now();


      window[callbackName] =
        function(result) {

          delete window[callbackName];


          // ---------------------------------------------------
          // エラー
          // ---------------------------------------------------

          if (!result.ok) {

            document.getElementById("status").innerHTML =
              '<span class="error">' +
              "出勤記録に失敗しました" +
              "</span>";

            document.getElementById("result").innerHTML =
              '<p class="error">' +
              (result.message ||
               "出勤記録に失敗しました。") +
              "</p>" +

              '<button onclick="nextEmployee()">' +
              "戻る" +
              "</button>";

            return;
          }


          // ---------------------------------------------------
          // 成功
          // ---------------------------------------------------

          document.getElementById("status").innerHTML =
            '<span class="ready">' +
            "受付完了" +
            "</span>";


          document.getElementById("result").innerHTML =

            '<div class="success">' +
            "✓ " +
            result.name +
            " さん" +
            "</div>" +

            '<div class="success">' +
            "出勤を記録しました" +
            "</div>";


          // 成功音
          playSuccessSound();


          // 1秒後に次の社員
          setTimeout(
            function() {

              nextEmployee();

            },
            1000
          );

        };


      // =======================================================
      // 今日の日付
      // =======================================================

      const today =
        new Date();


      const yyyy =
        today.getFullYear();


      const mm =
        String(
          today.getMonth() + 1
        ).padStart(2, "0");


      const dd =
        String(
          today.getDate()
        ).padStart(2, "0");


      const dateString =
        yyyy +
        "-" +
        mm +
        "-" +
        dd;


      // =======================================================
      // Apps Scriptへ出勤記録
      // =======================================================

      const script =
        document.createElement("script");


      script.src =
        APPS_SCRIPT_URL +
        "?action=attendance" +
        "&employeeId=" +
        encodeURIComponent(
          currentEmployee.id
        ) +
        "&date=" +
        encodeURIComponent(
          dateString
        ) +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


      // -------------------------------------------------------
      // 通信エラー
      // -------------------------------------------------------

      script.onerror =
        function() {

          delete window[callbackName];

          document.getElementById("status").innerHTML =
            '<span class="error">' +
            "通信エラー" +
            "</span>";

          document.getElementById("result").innerHTML =
            '<p class="error">' +
            "出勤記録の通信に失敗しました。" +
            "</p>" +

            '<button onclick="nextEmployee()">' +
            "戻る" +
            "</button>";

        };


      document.body.appendChild(script);

    }


    // =========================================================
    // 次の社員
    // =========================================================

    function nextEmployee() {

      processing = false;

      currentEmployee = null;


      document.getElementById("status").innerHTML =
        '<span class="ready">' +
        "受付準備完了" +
        "</span>";


      document.getElementById("result").innerHTML =
        "<p>QRコードを読み取ってください</p>";

    }


    // =========================================================
    // QRスキャナー開始
    // =========================================================

    function startScanner() {

      const scanner =
        new Html5Qrcode("reader");


      scanner.start(

        // iPadフロントカメラ
        {
          facingMode: "user"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        onScanSuccess,

        function(errorMessage) {
          // 読み取り中の細かいエラーは無視
        }

      ).catch(
        function(error) {

          document.getElementById("status").innerHTML =
            '<span class="error">' +
            "カメラを起動できませんでした。<br>" +
            error +
            "</span>";

        }
      );

    }


    // =========================================================
    // ページ読み込み
    // =========================================================

    window.addEventListener(
      "load",
      function() {

        // 最初から受付可能
        document.getElementById("status").innerHTML =
          '<span class="ready">' +
          "受付準備完了" +
          "</span>";


        // カメラ起動
        startScanner();

      }
    );

  </script>

</body>
</html>
