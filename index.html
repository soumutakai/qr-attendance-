<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: white;
    }

    #status {
      margin: 20px 0;
      font-size: 20px;
      font-weight: bold;
    }

    #result {
      margin: 20px auto;
      max-width: 500px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      font-size: 22px;
    }

    button {
      font-size: 24px;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      background: #1976d2;
      color: white;
    }

    button:disabled {
      background: #aaa;
    }

    .ready {
      color: green;
    }

    .error {
      color: red;
    }

    .employee-name {
      font-size: 36px;
      font-weight: bold;
      margin: 20px 0;
    }

    .success {
      color: green;
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>社員受付</h1>

  <div id="status">
    社員データを読み込んでいます…
  </div>

  <div id="reader"></div>

  <div id="result">
    <p>準備中です</p>
  </div>


  <script>

    // =========================================================
    // Apps Script WebアプリURL
    // =========================================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyAJlvXfXFLtn0iTYh6obTzeoe-YkTW8YVzVMtAHPEsOzEnkO_6scH3_9W8MOCzE9Yh/exec";


    // =========================================================
    // グローバル変数
    // =========================================================

    let employees = [];
    let processing = false;

    let audioContext = null;


    // =========================================================
    // 成功音の準備
    // =========================================================

    function prepareSuccessSound() {
      try {

        if (!audioContext) {
          audioContext =
            new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

      } catch (error) {
        console.log("音声準備エラー", error);
      }
    }


    // =========================================================
    // 成功音
    // =========================================================

    function playSuccessSound() {

      try {

        if (!audioContext) return;

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        const now = audioContext.currentTime;

        const oscillator =
          audioContext.createOscillator();

        const gainNode =
          audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.type = "sine";

        // キーン♪
        oscillator.frequency.value = 1200;

        gainNode.gain.setValueAtTime(
          0.001,
          now
        );

        gainNode.gain.exponentialRampToValueAtTime(
          0.18,
          now + 0.02
        );

        gainNode.gain.exponentialRampToValueAtTime(
          0.001,
          now + 0.35
        );

        oscillator.start(now);

        oscillator.stop(now + 0.35);

      } catch (error) {

        console.log("成功音エラー", error);

      }

    }


    // =========================================================
    // 社員データ読み込み
    // JSONP方式
    // =========================================================

    function loadEmployees() {

      const status =
        document.getElementById("status");

      status.textContent =
        "社員データを読み込んでいます…";


      const callbackName =
        "employeesCallback_" + Date.now();


      window[callbackName] =
        function(result) {

          delete window[callbackName];


          // -----------------------------
          // エラー
          // -----------------------------

          if (!result.ok) {

            status.innerHTML =
              '<span class="error">' +
              "社員データの読み込みに失敗しました<br>" +
              (result.message ||
                "社員データを取得できませんでした。") +
              "</span>";


            document.getElementById("result").innerHTML =
              '<button onclick="loadEmployees()">' +
              "再読み込み" +
              "</button>";

            return;
          }


          // -----------------------------
          // 社員データ取得成功
          // -----------------------------

          employees =
            result.employees || [];


          // -----------------------------
          // 0人
          // -----------------------------

          if (employees.length === 0) {

            status.innerHTML =
              '<span class="error">' +
              "社員データが0人です。" +
              "</span>";

            return;
          }


          // -----------------------------
          // 正常
          // -----------------------------

          status.innerHTML =
            '<span class="ready">' +
            "受付準備完了（" +
            employees.length +
            "人）" +
            "</span>";


          document.getElementById("result").innerHTML =
            "<p>QRコードを読み取ってください</p>";

        };


      // =======================================================
      // JSONP用scriptタグ
      // =======================================================

      const script =
        document.createElement("script");


      script.src =
        APPS_SCRIPT_URL +
        "?action=employees" +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


      script.onerror =
        function() {

          delete window[callbackName];

          status.innerHTML =
            '<span class="error">' +
            "社員データの読み込みに失敗しました。" +
            "</span>";


          document.getElementById("result").innerHTML =
            '<button onclick="loadEmployees()">' +
            "再読み込み" +
            "</button>";

        };


      document.body.appendChild(script);

    }


    // =========================================================
    // QRコード読み取り成功
    // =========================================================

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }


      processing = true;


      const token =
        String(decodedText || "")
          .replace(/\s/g, "")
          .trim();


      // -------------------------------------------------------
      // 社員マスタから検索
      // -------------------------------------------------------

      const employee =
        employees.find(function(row) {

          return String(row.token)
            .replace(/\s/g, "")
            .trim() === token;

        });


      // -------------------------------------------------------
      // 登録されていないQR
      // -------------------------------------------------------

      if (!employee) {

        document.getElementById("result").innerHTML =
          '<p class="error">' +
          "登録されていないQRコードです。" +
          "</p>";


        setTimeout(function() {

          processing = false;

          document.getElementById("result").innerHTML =
            "<p>QRコードを読み取ってください</p>";

        }, 2000);


        return;
      }


      // -------------------------------------------------------
      // 社員名表示
      // -------------------------------------------------------

      document.getElementById("result").innerHTML =

        '<div class="employee-name">' +
        employee.name +
        " さん</div>" +

        "<p>この社員で間違いありませんか？</p>" +

        '<button onclick="confirmEmployee(\'' +
        employee.id +
        "')\">" +
        "本人です" +
        "</button>" +

        '<button onclick="nextEmployee()">' +
        "キャンセル" +
        "</button>";

    }


    // =========================================================
    // 本人確認 → 出勤記録
    // =========================================================

    function confirmEmployee(id) {

      // iPadの音声再生許可を取る
      prepareSuccessSound();


      document.getElementById("result").innerHTML =
        "<p>記録しています…</p>";


      const callbackName =
        "attendanceCallback_" + Date.now();


      window[callbackName] =
        function(result) {

          delete window[callbackName];


          // ---------------------------------------------------
          // エラー
          // ---------------------------------------------------

          if (!result.ok) {

            document.getElementById("result").innerHTML =
              '<p class="error">' +
              "出勤記録に失敗しました<br>" +
              (result.message ||
                "エラーが発生しました。") +
              "</p>" +

              '<button onclick="nextEmployee()">' +
              "戻る" +
              "</button>";

            return;
          }


          // ---------------------------------------------------
          // 成功
          // ---------------------------------------------------

          document.getElementById("result").innerHTML =

            '<div class="success">' +
            "✓ " +
            result.name +
            " さん" +
            "</div>" +

            '<div class="success">' +
            "出勤を記録しました" +
            "</div>";


          // 成功音
          playSuccessSound();


          // 少し表示してから次の社員へ
          setTimeout(function() {

            nextEmployee();

          }, 1000);

        };


      // =======================================================
      // 今日の日付
      // =======================================================

      const today =
        new Date();


      const yyyy =
        today.getFullYear();


      const mm =
        String(today.getMonth() + 1)
          .padStart(2, "0");


      const dd =
        String(today.getDate())
          .padStart(2, "0");


      const dateString =
        yyyy + "-" + mm + "-" + dd;


      // =======================================================
      // Apps Scriptへ出勤記録
      // =======================================================

      const script =
        document.createElement("script");


      script.src =
        APPS_SCRIPT_URL +
        "?action=attendance" +
        "&employeeId=" +
        encodeURIComponent(id) +
        "&date=" +
        encodeURIComponent(dateString) +
        "&callback=" +
        callbackName +
        "&t=" +
        Date.now();


      script.onerror =
        function() {

          delete window[callbackName];

          document.getElementById("result").innerHTML =
            '<p class="error">' +
            "出勤記録に失敗しました。" +
            "</p>" +

            '<button onclick="nextEmployee()">' +
            "戻る" +
            "</button>";

        };


      document.body.appendChild(script);

    }


    // =========================================================
    // 次の社員
    // =========================================================

    function nextEmployee() {

      processing = false;


      document.getElementById("result").innerHTML =
        "<p>QRコードを読み取ってください</p>";

    }


    // =========================================================
    // QRスキャナー開始
    // =========================================================

    function startScanner() {

      const scanner =
        new Html5Qrcode("reader");


      scanner.start(

        // iPadのフロントカメラ
        {
          facingMode: "user"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        onScanSuccess,

        function(errorMessage) {
          // 読み取り中の細かいエラーは無視
        }

      ).catch(function(error) {

        document.getElementById("status").innerHTML =
          '<span class="error">' +
          "カメラを起動できませんでした。<br>" +
          error +
          "</span>";

      });

    }


    // =========================================================
    // ページ読み込み
    // =========================================================

    window.addEventListener(
      "load",
      function() {

        // 社員データ取得
        loadEmployees();


        // カメラ起動
        startScanner();

      }
    );

  </script>

</body>
</html>
