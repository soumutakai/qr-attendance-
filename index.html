<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>社員受付</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 30px;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin-top: 25px;
      font-size: 24px;
      font-weight: bold;
      min-height: 80px;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 10px;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }

    .ready {
      color: green;
    }

  </style>

</head>


<body>

  <h1>社員受付</h1>

  <p id="status">
    社員データを読み込んでいます…
  </p>

  <div id="reader"></div>

  <div id="result"></div>


<script>


// ==================================================
// Apps ScriptのURL
// ==================================================

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx0Yhbu42o5JXZ91oB_TdQxb6ljHvoc6tIIo2LiPIKrEyV67dsBmrdr0thm9aainFPM/exec";


// ==================================================
// 社員一覧
// ==================================================

let employees = [];


// ==================================================
// 処理中かどうか
// ==================================================

let processing = false;


// ==================================================
// 成功音用
// ==================================================

let audioContext = null;


// ==================================================
// 成功音の準備
// ==================================================

function prepareSuccessSound() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (audioContext.state === "suspended") {

      audioContext.resume();

    }

  } catch (error) {

    console.log(
      "音声準備エラー",
      error
    );

  }

}


// ==================================================
// 成功音を鳴らす
// ==================================================

function playSuccessSound() {

  try {

    if (!audioContext) {
      return;
    }


    if (audioContext.state === "suspended") {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gainNode =
      audioContext.createGain();


    oscillator.connect(gainNode);

    gainNode.connect(
      audioContext.destination
    );


    // =================================================
    // 音の設定
    // =================================================

    oscillator.type = "sine";

    oscillator.frequency.value = 880;


    gainNode.gain.setValueAtTime(
      0.15,
      audioContext.currentTime
    );


    gainNode.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.25
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.25
    );


  } catch (error) {

    console.log(
      "成功音エラー",
      error
    );

  }

}



// ==================================================
// 社員マスタを最初に読み込む
// ==================================================

async function loadEmployees() {

  const status =
    document.getElementById("status");


  status.textContent =
    "社員データを読み込んでいます…";


  try {

    const url =
      APPS_SCRIPT_URL +
      "?action=employees&t=" +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "サーバーとの通信に失敗しました。"
      );

    }


    const result =
      await response.json();


    if (!result.ok) {

      throw new Error(
        result.message ||
        "社員データを取得できませんでした。"
      );

    }


    employees =
      result.employees || [];


    if (employees.length === 0) {

      throw new Error(
        "社員データが0人です。"
      );

    }


    status.innerHTML =
      '<span class="ready">' +
      "受付準備完了（" +
      employees.length +
      "人）" +
      "</span>";


    document.getElementById("result").innerHTML =
      "<p>QRコードを読み取ってください</p>";


  } catch (error) {

    console.error(error);


    status.innerHTML =
      '<span class="error">' +
      "社員データの読み込みに失敗しました<br>" +
      error.message +
      "</span>";


    document.getElementById("result").innerHTML =

      '<button onclick="loadEmployees()">' +
      "再読み込み" +
      "</button>";

  }

}



// ==================================================
// QRコードを読み取ったとき
// ==================================================

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  // =================================================
  // 社員データがまだ読み込めていない場合
  // =================================================

  if (employees.length === 0) {

    document.getElementById("result").innerHTML =

      '<p class="error">' +
      "社員データを読み込んでいます。<br>" +
      "少し待ってください。" +
      "</p>";

    return;

  }


  processing = true;


  // =================================================
  // QRの文字列
  // =================================================

  const searchToken =
    String(decodedText || "")
      .replace(/\s/g, "")
      .trim();


  // =================================================
  // iPad内で社員を検索
  // =================================================

  const employee =
    employees.find(function(employee) {

      const token =
        String(employee.token || "")
          .replace(/\s/g, "")
          .trim();


      return token === searchToken;

    });


  // =================================================
  // 見つからない場合
  // =================================================

  if (!employee) {

    document.getElementById("result").innerHTML =

      '<p class="error">' +
      "登録されていないQRコードです。" +
      "</p>" +

      '<button onclick="nextEmployee()">' +
      "もう一度読み取る" +
      "</button>";


    processing = false;


    return;

  }


  // =================================================
  // 社員名表示
  // =================================================

  document.getElementById("result").innerHTML =

    "<h2>" +
    employee.name +
    " さん</h2>" +

    "<p>この名前で記録しますか？</p>" +

    '<button onclick="confirmEmployee(\'' +
    employee.id +
    '\')">' +
    "本人です" +
    "</button>" +

    '<button onclick="nextEmployee()">' +
    "違います" +
    "</button>";

}



// ==================================================
// 「本人です」を押したとき
// ==================================================

function confirmEmployee(id) {


  // =================================================
  // iPadのボタン操作中に音声再生の準備
  // =================================================

  prepareSuccessSound();


  // =================================================
  // 記録中表示
  // =================================================

  document.getElementById("result").innerHTML =
    "<p>出勤を記録しています…</p>";


  // =================================================
  // 今日の日付
  // =================================================

  const now =
    new Date();


  const dateText =
    now.getFullYear() +
    "-" +
    String(
      now.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
      now.getDate()
    ).padStart(2, "0");


  // =================================================
  // 出勤記録
  // =================================================

  const callbackName =
    "attendanceCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {


      delete window[callbackName];


      // =================================================
      // エラー
      // =================================================

      if (!result.ok) {

        document.getElementById("result").innerHTML =

          '<p class="error">' +
          result.message +
          "</p>" +

          '<button onclick="nextEmployee()">' +
          "もう一度読み取る" +
          "</button>";


        return;

      }


      // =================================================
      // 成功表示
      // =================================================

      document.getElementById("result").innerHTML =

        '<h2 class="success">' +
        "✓ " +
        result.name +
        " さん" +
        "</h2>" +

        "<p>出勤を記録しました</p>";


      // =================================================
      // 成功音
      // =================================================

      playSuccessSound();


      // =================================================
      // 次の人
      // =================================================

      setTimeout(function() {

        nextEmployee();

      }, 500);

    };


  // =================================================
  // Apps Scriptへ出勤記録
  // =================================================

  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=attendance" +
    "&employeeId=" +
    encodeURIComponent(id) +
    "&date=" +
    encodeURIComponent(dateText) +
    "&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  document.body.appendChild(script);

}



// ==================================================
// 次の人
// ==================================================

function nextEmployee() {

  processing = false;


  document.getElementById("result").innerHTML =
    "<p>次の方のQRコードを読み取ってください</p>";

}



// ==================================================
// QRスキャナー開始
// ==================================================

const scanner =
  new Html5Qrcode("reader");


scanner.start(

  {
    facingMode: "user"
  },

  {
    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }
  },

  onScanSuccess,

  function(errorMessage) {

    // 読み取り中のエラーは表示しない

  }

)

.catch(function(error) {

  document.getElementById("result").innerHTML =

    '<p class="error">' +
    "QRスキャナーを起動できませんでした<br>" +
    error +
    "</p>";

});



// ==================================================
// ページを開いたら社員一覧を取得
// ==================================================

loadEmployees();


</script>

</body>

</html>
